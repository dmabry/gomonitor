name: Go Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.24.4'  # Updated to use Go 1.24.4

    - name: Install dependencies
      run: go mod tidy

    - name: Check code quality
      run: |
        test -z "$(gofmt -l .)"
        go vet ./...
        go mod verify

    - name: Run tests
      run: go test ./...

    - name: Build the application
      run: go build -v ./...
